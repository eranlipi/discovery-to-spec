# Checks design explorations on every pull request that touches them.
# Stages that were already passed must be complete; the current stage may be in progress.
# With "approvals": { "verify": "github-pr" } in .d2s.json, it also checks that everyone
# listed under "Approved by" approved the pull request, and runs again when a review arrives.
name: d2s check

on:
  pull_request:
    paths:
      - "{{dir}}/**"
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
{{ciInstall}}      - run: {{cli}} check --verify-approvals
        env:
          GITHUB_TOKEN: ${{ github.token }}
