# Publishes the version in package.json: a GitHub release with notes from CHANGELOG.md,
# and the package on npm. It runs on every push to master and skips whatever is already out,
# so releasing is: bump "version" in package.json, add its CHANGELOG.md section, merge.
# Pushing a v* tag, or running it from the Actions tab, works too.
name: release

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # npm provenance and trusted publishing

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Work out the tag
        id: tag
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($tag)." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already released on GitHub."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          spec="$(node -p "const p = require('./package.json'); p.name + '@' + p.version")"
          if npm view "$spec" version > /dev/null 2>&1; then
            echo "$spec is already on npm."
            echo "npm_skip=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.tag.outputs.skip != 'true' || steps.tag.outputs.npm_skip != 'true'
        run: npm test
      - if: steps.tag.outputs.skip != 'true'
        run: node .github/scripts/release-notes.mjs > notes.md
      - name: Package the Figma plugin and the AI assistant
        if: steps.tag.outputs.skip != 'true'
        run: |
          npm run plugin
          (cd figma-plugin && zip -r "../d2s-figma-plugin-$TAG.zip" manifest.json dist README.md)
          npm run claude-skill
          (cd integrations/claude-app/dist && zip -r "../../../d2s-discovery-skill-$TAG.zip" d2s-discovery)
          cp integrations/claude-app/dist/assistant-instructions.md d2s-assistant-instructions.md
        env:
          TAG: ${{ steps.tag.outputs.tag }}
      - name: Create the release
        if: steps.tag.outputs.skip != 'true'
        run: gh release create "$TAG" "d2s-figma-plugin-$TAG.zip" "d2s-discovery-skill-$TAG.zip" d2s-assistant-instructions.md --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA"
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
      # Authenticates with npm trusted publishing (set up on npmjs.com for this repo and
      # release.yml), or with an NPM_TOKEN repository secret when there is one.
      - name: Publish to npm
        if: steps.tag.outputs.npm_skip != 'true'
        run: |
          npm install -g npm@^11.5.1
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
